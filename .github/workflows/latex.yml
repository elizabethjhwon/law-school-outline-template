name: Build LaTeX example

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: example/outline.tex
          working_directory: .
          latexmk_use_xelatex: false
